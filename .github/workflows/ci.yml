name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew clean build installDist --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: transerver-snapshot
          path: build/distributions/*
          if-no-files-found: error
          retention-days: 14
